<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sahayak Admin</title>
    <style>
      :root { --fg: #0f172a; --muted: #475569; --line: #e2e8f0; --bg: #f8fafc; --ok: #15803d; --bad: #b91c1c; --accent: #1d4ed8; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
      main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
      h1 { font-size: 18px; margin: 0; } h2 { font-size: 16px; margin: 20px 0 8px; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 13px; color: var(--muted); font-weight: 600; }
      tr.row { cursor: pointer; } tr.row:hover, tr.row:focus { background: #eff6ff; }
      /* Keyboard focus is always visible (rows, buttons, fields); mouse clicks do not draw the ring. */
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      tr.row:focus-visible { outline-offset: -3px; }
      button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; min-height: 36px; }
      button:not(:disabled):hover { filter: brightness(.94); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid; }
      .badge.pending_verification { color: #92400e; background: #fffbeb; border-color: #f59e0b; }
      .badge.approved { color: var(--ok); background: #f0fdf4; border-color: #86efac; }
      .badge.rejected { color: var(--bad); background: #fef2f2; border-color: #fca5a5; }
      .badge.draft { color: var(--muted); background: #f1f5f9; border-color: #cbd5e1; }
      .field-error { color: var(--bad); font-weight: 600; margin: 4px 0 0; }
      textarea[aria-invalid="true"] { border-color: var(--bad); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
      button.reject { background: var(--bad); border-color: var(--bad); color: #fff; }
      input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      textarea { width: 100%; min-height: 70px; }
      label { display: block; margin: 8px 0 4px; font-weight: 600; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .muted { color: var(--muted); } .error { color: var(--bad); } .ok { color: var(--ok); }
      .missing { color: var(--bad); font-weight: 600; }
      dl { display: grid; grid-template-columns: 200px 1fr; gap: 4px 12px; margin: 0; }
      dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
      .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
      h3 { font-size: 14px; margin: 16px 0 6px; }
      .num { text-align: right; white-space: nowrap; }
      .scroll { overflow-x: auto; }
      .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
      .filters label { margin-top: 0; }
      tr.expand > td { background: #f1f5f9; padding: 12px 16px; }
      .lifecycle table { background: #fff; }
      @media (max-width: 640px) { dl { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
