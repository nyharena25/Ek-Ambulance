_format_version: "3.0"

# Hosted gateway. Auth/REST/Storage go to the hosted Supabase project; /realtime/token and /triage/extract go to the
# token-mint container (AUTH_MODE=strict under docker-compose.prod.yml). Rate limits are per client IP, in-memory (policy: local).
services:
  - name: supabase-auth
    url: https://nzwbwuhbtqhhjwnopwmm.supabase.co/auth/v1
    routes:
      - name: auth
        paths: ["/auth/v1"]
        strip_path: true
    plugins:
      - name: rate-limiting
        config: { minute: 20, policy: local, limit_by: ip }

  - name: supabase-rest
    url: https://nzwbwuhbtqhhjwnopwmm.supabase.co/rest/v1
    routes:
      - name: rest
        paths: ["/rest/v1"]
        strip_path: true
    plugins:
      - name: rate-limiting
        config: { minute: 300, policy: local, limit_by: ip }

  # Storage object endpoints only - what the apps call: KYC upload (POST /object/{bucket}/{path}), signed-link
  # creation (POST /object/sign/{bucket}/{path}) and the signed download (GET /object/sign/...). A document
  # replacement is a new upload at a new path (driverServer.uploadKycDocument), so no PUT/DELETE. Bucket
  # administration, S3 and resumable uploads are not routed. Headers pass through untouched: Storage authorizes
  # with the caller's own JWT against the storage.objects policies (the KYC bucket is private).
  - name: supabase-storage
    url: https://nzwbwuhbtqhhjwnopwmm.supabase.co/storage/v1/object
    routes:
      - name: storage-object
        paths: ["/storage/v1/object"]
        strip_path: true
        methods: ["GET", "POST", "OPTIONS"]
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local, limit_by: ip }

  - name: realtime-token
    url: http://token-mint:8080/realtime/token
    routes:
      - name: realtime-token
        paths: ["/realtime/token"]
        strip_path: true
        methods: ["POST", "OPTIONS"]
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local, limit_by: ip }

  # Server-side OpenRouter relay (Phase B item 8): the key lives only behind this route now, never in the
  # client bundle. Lower limit than realtime-token - each call is a real, billed AI request, not a token mint.
  - name: triage-extract
    url: http://token-mint:8080/triage/extract
    routes:
      - name: triage-extract
        paths: ["/triage/extract"]
        strip_path: true
        methods: ["POST", "OPTIONS"]
    plugins:
      - name: rate-limiting
        config: { minute: 20, policy: local, limit_by: ip }

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      # content-profile / x-supabase-api-version: sent by supabase-js from a BROWSER (the admin console) on RPC POSTs
      # and auth calls; the mobile apps never trigger a CORS preflight.
      headers: [Authorization, Content-Type, apikey, x-client-info, content-profile, x-supabase-api-version]
      max_age: 3600
